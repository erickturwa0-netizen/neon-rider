<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Neon Rider</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #050014; font-family: ui-sans-serif, system-ui, sans-serif; color: #f4f7ff; }
    #c { display: block; width: 100%; height: 100%; }
    .hud { position: absolute; top: 16px; left: 16px; right: 16px; display: none; gap: 10px; pointer-events: none; }
    .hud.show { display: flex; }
    .card { background: rgba(8,4,24,.72); border: 1px solid rgba(255,45,149,.35); border-radius: 12px; padding: 8px 12px; min-width: 84px; }
    .card span { display: block; font-size: 10px; letter-spacing: .14em; color: #8be9ff; }
    .overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; background: linear-gradient(180deg, rgba(5,0,20,.2), rgba(5,0,20,.78)); padding: 24px; }
    .hidden { display: none !important; }
    .eyebrow { letter-spacing: .28em; color: #1ce8ff; font-size: 12px; }
    h1 { font-size: clamp(48px, 10vw, 88px); margin: 4px 0 12px; letter-spacing: .08em; }
    .lede { max-width: 420px; color: #c9d4ff; }
    .cta { margin-top: 18px; border: 0; border-radius: 999px; padding: 14px 28px; font-weight: 700; letter-spacing: .08em; background: linear-gradient(90deg, #ff2d95, #7c4dff); color: #fff; cursor: pointer; }
    .hint { margin-top: 14px; color: #8ea0d8; font-size: 13px; }
    .bar { position: absolute; left: 12px; right: 12px; bottom: 16px; display: grid; grid-template-columns: 1fr 1.2fr 1fr; gap: 10px; }
    .bar button { height: 56px; border-radius: 16px; border: 1px solid rgba(140,233,255,.35); background: rgba(8,4,24,.7); color: #fff; font-weight: 700; }
  </style>
</head>
<body>
  <canvas id="c" aria-label="Neon Rider"></canvas>
  <div class="hud" id="hud">
    <div class="card"><span>SCORE</span><strong id="score">0</strong></div>
    <div class="card"><span>BEST</span><strong id="best">0</strong></div>
    <div class="card"><span>SPEED</span><strong id="spd">0</strong></div>
  </div>
  <div class="overlay" id="menu">
    <p class="eyebrow">NEON HIGHWAY</p>
    <h1>RIDER</h1>
    <p class="lede">Pinda njia tatu, epuka magari, kukusanya coins. Usigongwe.</p>
    <button class="cta" id="start">Anza Ride</button>
    <p class="hint">← → au A/D · Space = nitro · Simu: swipe au buttons</p>
  </div>
  <div class="overlay hidden" id="over">
    <p class="eyebrow">CRASHED</p>
    <h1>GAME OVER</h1>
    <p class="lede">Score: <span id="fs">0</span> · Best: <span id="fb">0</span></p>
    <button class="cta" id="retry">Ride Tena</button>
  </div>
  <div class="bar">
    <button id="left" type="button">◀</button>
    <button id="nitro" type="button">NITRO</button>
    <button id="right" type="button">▶</button>
  </div>
  <script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.170.0/build/three.module.js" } }
  </script>
  <script type="module">
    import * as THREE from 'three';

    const LANES = [-3.2, 0, 3.2];
    const KEY = 'neon-rider-best';
    const canvas = document.getElementById('c');
    const hud = document.getElementById('hud');
    const menu = document.getElementById('menu');
    const over = document.getElementById('over');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const spdEl = document.getElementById('spd');
    const fs = document.getElementById('fs');
    const fb = document.getElementById('fb');

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x050014);
    scene.fog = new THREE.Fog(0x050014, 18, 90);

    const camera = new THREE.PerspectiveCamera(62, innerWidth / innerHeight, 0.1, 200);
    camera.position.set(0, 6.2, 10);
    camera.lookAt(0, 1.2, -12);

    scene.add(new THREE.HemisphereLight(0x66ccff, 0x220033, 0.65));
    const keyLight = new THREE.DirectionalLight(0xff66cc, 1.1);
    keyLight.position.set(6, 14, 8);
    scene.add(keyLight);
    const rim = new THREE.PointLight(0x22f3ff, 2.4, 40);
    rim.position.set(0, 4, 2);
    scene.add(rim);

    const road = new THREE.Mesh(
      new THREE.PlaneGeometry(14, 220),
      new THREE.MeshStandardMaterial({ color: 0x141428, roughness: 0.72, metalness: 0.18 })
    );
    road.rotation.x = -Math.PI / 2;
    road.position.z = -80;
    scene.add(road);

    const stripeGeo = new THREE.BoxGeometry(0.12, 0.04, 2.2);
    const stripeMat = new THREE.MeshStandardMaterial({ color: 0xfff6a8, emissive: 0xffee88, emissiveIntensity: 0.7 });
    const stripes = [];
    for (let i = 0; i < 28; i++) {
      const s = new THREE.Mesh(stripeGeo, stripeMat);
      s.position.set(0, 0.03, -i * 6);
      scene.add(s);
      stripes.push(s);
    }

    const railMat = new THREE.MeshStandardMaterial({ color: 0x2a1048, emissive: 0xff2d95, emissiveIntensity: 0.35 });
    const railGeo = new THREE.BoxGeometry(0.35, 0.7, 220);
    const leftRail = new THREE.Mesh(railGeo, railMat);
    leftRail.position.set(-7.1, 0.35, -80);
    const rightRail = leftRail.clone();
    rightRail.position.x = 7.1;
    scene.add(leftRail, rightRail);

    function makeBike() {
      const g = new THREE.Group();
      const body = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.42, 1.8), new THREE.MeshStandardMaterial({ color: 0x111118, metalness: 0.7, roughness: 0.25 }));
      body.position.y = 0.55;
      const tank = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.28, 0.7), new THREE.MeshStandardMaterial({ color: 0xff2d95, emissive: 0xff2d95, emissiveIntensity: 0.5 }));
      tank.position.set(0, 0.82, -0.15);
      const rider = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.55, 0.42), new THREE.MeshStandardMaterial({ color: 0x1ce8ff }));
      rider.position.set(0, 1.18, 0.15);
      const wheelMat = new THREE.MeshStandardMaterial({ color: 0x22222a });
      const front = new THREE.Mesh(new THREE.CylinderGeometry(0.32, 0.32, 0.18, 16), wheelMat);
      front.rotation.z = Math.PI / 2;
      front.position.set(0, 0.32, -0.72);
      const back = front.clone();
      back.position.z = 0.72;
      g.add(body, tank, rider, front, back);
      g.position.set(0, 0, 2.4);
      return g;
    }

    const bike = makeBike();
    scene.add(bike);

    const obstacles = [];
    const carColors = [0xff4d4d, 0x4dff88, 0x4d7dff, 0xffa64d];

    function makeCar(color) {
      const g = new THREE.Group();
      const body = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.7, 2.4), new THREE.MeshStandardMaterial({ color, metalness: 0.45, roughness: 0.35 }));
      body.position.y = 0.55;
      const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.45, 1.1), new THREE.MeshStandardMaterial({ color: 0x88e8ff, transparent: true, opacity: 0.55 }));
      cabin.position.set(0, 1.05, -0.15);
      g.add(body, cabin);
      return g;
    }

    function makeCoin() {
      const g = new THREE.Group();
      const ring = new THREE.Mesh(
        new THREE.TorusGeometry(0.38, 0.1, 10, 18),
        new THREE.MeshStandardMaterial({ color: 0xffd24a, emissive: 0xffc107, emissiveIntensity: 0.9, metalness: 0.8 })
      );
      ring.rotation.y = Math.PI / 2;
      ring.position.y = 1.1;
      g.add(ring);
      return g;
    }

    let state = 'menu';
    let lane = 1;
    let targetX = LANES[lane];
    let speed = 22;
    let distance = 0;
    let score = 0;
    let best = Number(localStorage.getItem(KEY) || 0);
    let spawnTimer = 0;
    let nitro = 0;
    let last = performance.now();
    bestEl.textContent = String(best);

    function resetWorld() {
      obstacles.forEach((o) => scene.remove(o.mesh));
      obstacles.length = 0;
      lane = 1;
      targetX = LANES[lane];
      bike.position.x = targetX;
      speed = 22;
      distance = 0;
      score = 0;
      spawnTimer = 0;
      nitro = 0;
      scoreEl.textContent = '0';
    }

    function startGame() {
      resetWorld();
      state = 'playing';
      menu.classList.add('hidden');
      over.classList.add('hidden');
      hud.classList.add('show');
    }

    function endGame() {
      state = 'over';
      best = Math.max(best, score);
      localStorage.setItem(KEY, String(best));
      fs.textContent = String(score);
      fb.textContent = String(best);
      bestEl.textContent = String(best);
      over.classList.remove('hidden');
    }

    function moveLane(dir) {
      if (state !== 'playing') return;
      lane = Math.max(0, Math.min(2, lane + dir));
      targetX = LANES[lane];
    }

    function spawn() {
      const laneIndex = Math.floor(Math.random() * 3);
      const kind = Math.random() < 0.72 ? 'car' : 'coin';
      const mesh = kind === 'car' ? makeCar(carColors[Math.floor(Math.random() * carColors.length)]) : makeCoin();
      const z = -70 - Math.random() * 18;
      mesh.position.set(LANES[laneIndex], 0, z);
      scene.add(mesh);
      obstacles.push({ mesh, lane: laneIndex, z, kind });
    }

    document.getElementById('start').onclick = startGame;
    document.getElementById('retry').onclick = startGame;
    document.getElementById('left').onclick = () => moveLane(-1);
    document.getElementById('right').onclick = () => moveLane(1);
    document.getElementById('nitro').onpointerdown = () => { if (state === 'playing') nitro = 0.55; };

    addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') moveLane(-1);
      if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') moveLane(1);
      if (e.key === ' ' || e.key === 'ArrowUp') {
        e.preventDefault();
        if (state !== 'playing') startGame();
        else nitro = 0.55;
      }
      if (e.key === 'Enter' && state !== 'playing') startGame();
    });

    let touchX = 0;
    canvas.addEventListener('touchstart', (e) => { touchX = e.changedTouches[0].clientX; }, { passive: true });
    canvas.addEventListener('touchend', (e) => {
      const dx = e.changedTouches[0].clientX - touchX;
      if (dx > 40) moveLane(1);
      if (dx < -40) moveLane(-1);
    }, { passive: true });

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    function tick(now) {
      const dt = Math.min(0.033, (now - last) / 1000);
      last = now;
      if (state === 'playing') {
        nitro = Math.max(0, nitro - dt);
        speed = Math.min(52, speed + dt * 1.15) + (nitro > 0 ? 14 : 0);
        distance += speed * dt;
        score = Math.floor(distance * 1.6);
        scoreEl.textContent = String(score);
        spdEl.textContent = String(Math.round(speed));
        bike.position.x += (targetX - bike.position.x) * Math.min(1, dt * 12);
        bike.rotation.z = (targetX - bike.position.x) * 0.08;
        bike.position.y = 0.06 * Math.sin(now * 0.02);
        spawnTimer -= dt;
        if (spawnTimer <= 0) {
          spawn();
          spawnTimer = Math.max(0.55, 1.35 - speed * 0.018);
        }
        for (let i = obstacles.length - 1; i >= 0; i--) {
          const o = obstacles[i];
          o.z += speed * dt;
          o.mesh.position.z = o.z;
          if (o.kind === 'coin') o.mesh.rotation.y += dt * 4;
          if (o.z > 8) {
            scene.remove(o.mesh);
            obstacles.splice(i, 1);
            continue;
          }
          const closeZ = Math.abs(o.z - bike.position.z) < 1.5;
          const sameLane = o.lane === lane && Math.abs(bike.position.x - LANES[o.lane]) < 1.1;
          if (closeZ && sameLane) {
            if (o.kind === 'coin') {
              score += 40;
              scene.remove(o.mesh);
              obstacles.splice(i, 1);
            } else {
              endGame();
            }
          }
        }
      }
      const scroll = (now * 0.018) % 6;
      stripes.forEach((s, i) => { s.position.z = ((-i * 6 + scroll) % 168) - 8; });
      camera.position.x += (bike.position.x * 0.55 - camera.position.x) * 0.08;
      renderer.render(scene, camera);
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  </script>
</body>
</html>
